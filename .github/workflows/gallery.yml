name: Generate Gallery

on:
  push:
    paths:
      - 'Foto/gallery/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-gallery:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate gallery.json
        run: |
          {
            echo "["
            find Foto/gallery -type f \
              \( -iname "*.jpg" -o \
                 -iname "*.jpeg" -o \
                 -iname "*.png" -o \
                 -iname "*.webp" -o \
                 -iname "*.mp4" -o \
                 -iname "*.webm" \) \
            | sort \
            | awk '{printf "\"%s\",\n",$0}'
            echo "]"
          } > gallery.json

          # Elimina la virgola finale
          sed -i ':a;N;$!ba;s/,\n]/\n]/' gallery.json

      - name: Commit gallery.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add gallery.json

          if git diff --cached --quiet; then
            echo "Nessuna modifica."
          else
            git commit -m "Aggiorna gallery.json"
            git push
          fi
